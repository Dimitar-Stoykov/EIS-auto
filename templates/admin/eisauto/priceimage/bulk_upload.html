{% extends "admin/base_site.html" %}
{% block content %}
<h2>Качи ценови снимки наведнъж</h2>
<p style="color:#aaa;">Изберете една или повече снимки. Всяка ще се добави като отделна ценова снимка.</p>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div style="margin:24px 0;">
        <input type="file" name="images" multiple accept="image/*"
               style="display:block;padding:12px;background:#1a1a2e;color:#fff;border:1px solid #444;border-radius:6px;width:100%;max-width:500px;">
    </div>
    <button type="submit" class="button default" style="background:#ffc107;color:#06162d;font-weight:700;border:none;padding:10px 24px;border-radius:4px;cursor:pointer;">
        Качи снимките
    </button>
    <a href=".." class="button" style="margin-left:12px;">Отказ</a>
</form>
{% endblock %}
