<nav class="luxury-navbar navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'home_page' %}">
            {% if site.logo %}
                <img src="{{ site.logo.url }}" alt="{{ site.company_name }}" class="luxury-logo">
            {% else %}
                <div class="brand-icon">{{ site.company_name }}</div>
                <div class="brand-text-wrap">
                    <span class="brand-name">{{ site.business_type }}</span>
                </div>
            {% endif %}
        </a>

        <button class="navbar-toggler border-0" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Меню">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mx-auto gap-1">
                <li class="nav-item">
                    <a class="nav-link luxury-link {% if request.path == '/' %}active{% endif %}"
                       href="{% url 'home_page' %}">Начало</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link luxury-link {% if '/about' in request.path %}active{% endif %}"
                       href="{% url 'about' %}">За нас</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link luxury-link {% if '/services' in request.path %}active{% endif %}"
                       href="{% url 'services' %}">Услуги</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link luxury-link {% if '/prices' in request.path %}active{% endif %}"
                       href="{% url 'prices' %}">Цени</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link luxury-link {% if '/gallery' in request.path %}active{% endif %}"
                       href="{% url 'gallery' %}">Галерия</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link luxury-link {% if '/contacts' in request.path %}active{% endif %}"
                       href="{% url 'contacts' %}">Контакти</a>
                </li>
            </ul>

            <div class="nav-actions">
                <a href="tel:{{ site.phone }}" class="nav-phone">
                    <i class="bi bi-telephone"></i>
                    {{ site.phone }}
                </a>
                <a href="tel:{{ site.phone }}" class="luxury-btn">
                    Запази час
                </a>
            </div>
        </div>
    </div>
</nav>
